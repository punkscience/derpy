name: APT Repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  apt-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up APT repo directories
        run: |
          mkdir -p apt/pool/main
          mkdir -p apt/dists/stable/main/binary-amd64
          mkdir -p apt/dists/stable/main/binary-arm64

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download .deb artifacts from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${RELEASE_TAG#v}"
          echo "Version: $VERSION"

          gh release download "$RELEASE_TAG" \
            --pattern "derpy_${VERSION}_amd64.deb" \
            --dir apt/pool/main
          gh release download "$RELEASE_TAG" \
            --pattern "derpy_${VERSION}_arm64.deb" \
            --dir apt/pool/main

      - name: Generate Packages files
        run: |
          cd apt
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz
          dpkg-scanpackages --arch arm64 pool/ > dists/stable/main/binary-arm64/Packages
          gzip -9c dists/stable/main/binary-arm64/Packages > dists/stable/main/binary-arm64/Packages.gz

      - name: Generate Release file
        run: |
          cd apt/dists/stable
          cat > Release <<'ENDOFRELEASE'
Origin: Punk Science Studios Inc
Label: derpy
Suite: stable
Codename: stable
Architectures: amd64 arm64
Components: main
Description: APT repository for derpy — terminal music player
ENDOFRELEASE
          echo "Date: $(date -Ru)" >> Release

          # Append checksums — no leading spaces (apt requires exactly one space)
          {
            echo "MD5Sum:"
            find . -type f \( -name Packages -o -name Packages.gz \) | sort | while read f; do
              printf " %s %s %s\n" "$(md5sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$(echo "$f" | sed 's|^\./||')"
            done
            echo "SHA1:"
            find . -type f \( -name Packages -o -name Packages.gz \) | sort | while read f; do
              printf " %s %s %s\n" "$(sha1sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$(echo "$f" | sed 's|^\./||')"
            done
            echo "SHA256:"
            find . -type f \( -name Packages -o -name Packages.gz \) | sort | while read f; do
              printf " %s %s %s\n" "$(sha256sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$(echo "$f" | sed 's|^\./||')"
            done
          } >> Release

      - name: Sign Release file with GPG
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          cd apt

          # If a stored GPG key exists as a secret, use it.
          # Otherwise generate a fresh one and warn the user to save it.
          if [ -n "$APT_SIGNING_KEY" ]; then
            echo "==> Using stored APT_SIGNING_KEY from secrets"
            echo "$APT_SIGNING_KEY" | gpg --batch --import
          else
            echo "==> ⚠️  APT_SIGNING_KEY secret not set — generating a one-time key"
            echo "==> Save the exported key below as APT_SIGNING_KEY secret for future runs!"
            # Generate a key non-interactively
            gpg --batch --generate-key <<GPGEOF
Key-Type: RSA
Key-Length: 4096
Name-Real: derpy Packaging
Name-Email: derpy-packaging@punkscience.ca
Expire-Date: 0
%no-protection
%commit
GPGEOF
          fi

          # Export the public key for the install script
          mkdir -p apt
          gpg --armor --export derpy-packaging@punkscience.ca > apt/derpy-archive-keyring.gpg

          # Sign Release
          cd dists/stable
          gpg --batch --yes --default-key derpy-packaging@punkscience.ca \
            --clearsign -o InRelease Release
          gpg --batch --yes --default-key derpy-packaging@punkscience.ca \
            --detach-sign -o Release.gpg Release

          # If we generated a new key, export it for the user to save
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo ""
            echo "============================================================"
            echo "⚠️  SAVE THIS PRIVATE KEY AS THE 'APT_SIGNING_KEY' SECRET:"
            echo "    Go to: https://github.com/punkscience/derpy/settings/secrets/actions"
            echo "============================================================"
            gpg --armor --export-secret-keys derpy-packaging@punkscience.ca
            echo "============================================================"
          fi

      - name: Copy install.sh to gh-pages root
        run: |
          curl -fsSL https://raw.githubusercontent.com/punkscience/derpy/main/install.sh -o install.sh
          chmod +x install.sh

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apt/ install.sh
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "apt: add derpy ${{ steps.tag.outputs.tag }} packages + install.sh"
            git push origin gh-pages
          fi