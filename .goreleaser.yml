# goreleaser configuration for derpy.
# Triggered on git tag pushes and manual workflow_dispatch via
# .github/workflows/release.yml.
version: 2

builds:
  - id: derpy
    binary: derpy
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
      - zip
    # tar.gz for linux/darwin, zip for windows.
    # goreleaser picks format suffix based on GOOS automatically,
    # but we explicitly list both so each target gets its natural
    # archive.
    format_overrides:
      - goos: windows
        formats: [zip]
      - goos: linux
        formats: [tar.gz]
      - goos: darwin
        formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Punk-Science-Studios-Inc
    name: derpy
  draft: false
  prerelease: auto

brews:
  - repository:
      owner: punkscience
      name: homebrew-derpy
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/Punk-Science-Studios-Inc/derpy"
    description: "Terminal music player — shuffles and plays a directory of audio files"
    license: "Unlicense"
    test: |
      system "#{bin}/derpy", "version"

nfpms:
  - id: derpy
    package_name: derpy
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    vendor: Punk Science Studios Inc
    homepage: https://github.com/Punk-Science-Studios-Inc/derpy
    maintainer: Darryl Wright <darryl@punkscience.ca>
    description: "Terminal music player — shuffles and plays a directory of audio files"
    license: Unlicense
    formats:
      - deb
    section: sound
    priority: optional
