# goreleaser configuration for derpy.
# Triggered on git tag pushes and manual workflow_dispatch via
# .github/workflows/release.yml.
version: 2

builds:
  - id: derpy
    binary: derpy
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
      - zip
    # tar.gz for linux/darwin, zip for windows.
    # goreleaser picks format suffix based on GOOS automatically,
    # but we explicitly list both so each target gets its natural
    # archive.
    format_overrides:
      - goos: windows
        formats: [zip]
      - goos: linux
        formats: [tar.gz]
      - goos: darwin
        formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: punkscience
    name: derpy
  draft: false
  prerelease: auto

brews:
  - repository:
      owner: punkscience
      name: homebrew-derpy
    directory: Formula
    homepage: "https://github.com/punkscience/derpy"
    description: "Terminal music player — shuffles and plays a directory of audio files"
    license: "MIT"
    test: |
      system "#{bin}/derpy", "version"
    # Cross-repo push requires a token with contents:write on homebrew-derpy.
    # Set the TAP_GITHUB_TOKEN secret in the derpy repo and pass it via
    # the GORELEASER_FORCE_TOKEN or TAP_GITHUB_TOKEN env var in CI.
    # For the default GITHUB_TOKEN (scoped to derpy only), use a PAT instead.

nfpms:
  - id: derpy
    package_name: derpy
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    vendor: Punk Science Studios Inc
    homepage: https://github.com/punkscience/derpy
    maintainer: Darryl Wright <darryl@punkscience.ca>
    description: "Terminal music player — shuffles and plays a directory of audio files"
    license: MIT
    formats:
      - deb
    section: sound
    priority: optional

chocolateys:
  - name: derpy
    owners: punkscience
    title: derpy
    authors: Darryl Wright
    project_url: https://github.com/punkscience/derpy
    license_url: https://github.com/punkscience/derpy/blob/main/LICENSE
    require_license_acceptance: false
    project_source_url: https://github.com/punkscience/derpy
    package_source_url: https://github.com/punkscience/derpy
    docs_url: https://github.com/punkscience/derpy
    bug_tracker_url: https://github.com/punkscience/derpy/issues
    tags: music player terminal cli audio foss cross-platform
    summary: Terminal music player — shuffles and plays a directory of audio files
    description: |
      derpy is a terminal-based music player written in Go. It recursively scans
      a directory for audio files, shuffles them, and plays them with a Bubble
      Tea TUI. Supports ListenBrainz scrobbling, Nostr earmarks, and encrypted
      Blossom cloud backup. Audio formats: mp3, wav, flac, ogg, m4a, aac.
    release_notes: "https://github.com/punkscience/derpy/releases/tag/{{ .Tag }}"
    api_key: "{{ .Env.CHOCOLATEY_API_KEY }}"
    source_repo: https://push.chocolatey.org/
